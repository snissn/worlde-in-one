<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wordle in One Challenge</title>
  <desc id="desc">A share preview for Wordle in One, a five-puzzle challenge where every board has one possible answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#102640"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14243a"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 448 C210 386 314 510 492 438 C648 376 716 210 910 256 C1042 288 1110 410 1200 358 L1200 630 L0 630 Z" fill="#173556" opacity="0.62"/>
  <path d="M0 120 C170 212 292 68 450 128 C624 194 672 344 838 300 C1014 254 1076 118 1200 172" fill="none" stroke="#58a2ff" stroke-width="3" opacity="0.24"/>

  <g filter="url(#shadow)">
    <rect x="84" y="78" width="1032" height="474" rx="36" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>

  <g transform="translate(140 138)">
    <text x="0" y="0" fill="#f6f8fc" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="0">Wordle in One</text>
    <text x="0" y="74" fill="#d6e2f0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750" letter-spacing="0">A shareable five-puzzle challenge</text>
    <text x="0" y="128" fill="#aab3c3" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="650" letter-spacing="0">Every board has one possible answer.</text>
  </g>

  <g transform="translate(735 112)">
    <rect x="0" y="0" width="300" height="366" rx="28" fill="#08111d" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(36 36)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#303b49" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="82" y="0" width="64" height="64" rx="10" fill="#c59a16"/>
      <rect x="164" y="0" width="64" height="64" rx="10" fill="#3f9449"/>
      <rect x="0" y="82" width="64" height="64" rx="10" fill="#3f9449"/>
      <rect x="82" y="82" width="64" height="64" rx="10" fill="#303b49" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="164" y="82" width="64" height="64" rx="10" fill="#c59a16"/>
      <rect x="0" y="164" width="64" height="64" rx="10" fill="#07111d" stroke="#58a2ff" stroke-width="3"/>
      <rect x="82" y="164" width="64" height="64" rx="10" fill="#07111d" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="164" y="164" width="64" height="64" rx="10" fill="#07111d" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="0" y="262" width="228" height="34" rx="17" fill="#58a2ff" opacity="0.18"/>
      <text x="114" y="286" text-anchor="middle" fill="#dcecff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Find the only answer</text>
    </g>
